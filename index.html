:root{--navy:#102a43;--blue:#1f6feb;--pale:#eaf2f8;--bg:#f3f6fa;--ink:#142333;--muted:#64748b;--green:#16845b;--red:#c0392b;--amber:#a96500}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--navy);color:white}.secondary{background:var(--pale);color:var(--navy)}.danger{background:#feeceb;color:var(--red)}.success{background:#e4f6ee;color:var(--green)}.muted{color:var(--muted)}.small{font-size:12px}.appbar{background:var(--navy);color:white;padding:18px 16px 24px;border-radius:0 0 24px 24px}.brand{display:flex;align-items:center;gap:12px}.ball{width:52px;height:52px;flex-shrink:0;border-radius:16px;background:#fff;display:grid;place-items:center;color:var(--navy);font-size:30px}.appbar h1{font-size:18px;margin:0}.appbar p{font-size:12px;margin:4px 0 0;color:#d6e4f0}.appbar .topline{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:13px}.wrap{max-width:760px;margin:auto;padding:14px 14px 90px}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #102a430c}.card h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#f7f9fc;border:1px solid #edf1f5;border-radius:14px;padding:14px}.stat strong{display:block;font-size:25px;color:var(--navy)}.stat span{font-size:12px;color:var(--muted)}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:12px;border:1px solid #d8e0e8;border-radius:11px;background:white;color:var(--ink)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5eaf0;display:flex;justify-content:center;gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{flex:1;max-width:150px;background:transparent;color:var(--muted);font-size:12px;padding:8px 3px}.nav button.active{background:var(--pale);color:var(--navy)}.player{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf1f5}.player:last-child{border-bottom:0}.avatar{width:38px;height:38px;border-radius:12px;background:var(--pale);display:grid;place-items:center;font-weight:800;color:var(--navy)}.playerinfo{flex:1;min-width:0}.playerinfo strong{display:block;font-size:14px}.playerinfo small{color:var(--muted)}.statusbtn{padding:8px 9px;font-size:12px;min-width:67px}.present{background:#e3f6ed;color:var(--green)}.absent{background:#ffebea;color:var(--red)}.excused{background:#fff2d9;color:var(--amber)}.pill{display:inline-block;border-radius:20px;padding:5px 9px;background:#edf2f7;font-size:11px;color:var(--navy)}.empty{text-align:center;padding:26px 10px;color:var(--muted)}.hidden{display:none!important}.notice{background:#fff5d9;border:1px solid #f5df9d;color:#795000;padding:11px 12px;border-radius:12px;font-size:12px;line-height:1.6}.login{max-width:430px;margin:28px auto;padding:0 16px}.login .card{padding:22px}.loginlogo{text-align:center;padding:18px 0}.loginlogo .ball{margin:0 auto 10px;width:72px;height:72px;font-size:42px}.loginlogo h1{font-size:21px;margin:0}.loginlogo p{margin:5px;color:var(--muted);font-size:13px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.sectionhead h2{margin:0}.reportrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #edf1f5;font-size:13px}.reportrow:last-child{border:0}.toast{position:fixed;top:12px;left:12px;right:12px;z-index:20;background:#142333;color:white;border-radius:12px;padding:13px;text-align:center;box-shadow:0 8px 30px #0002}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:20px}

/* Premium Handball Academy visual refresh */
:root{--navy:#06152b;--blue:#168cff;--pale:#102d4d;--bg:#030b19;--ink:#eef5ff;--muted:#94a9c7;--green:#17d6a0;--red:#ff4f69;--amber:#ffb12b}
html{background:#030b19}body{background:radial-gradient(ellipse at 15% 0%,#123e75 0,transparent 35%),radial-gradient(ellipse at 95% 16%,#74301f 0,transparent 29%),linear-gradient(160deg,#06152b 0%,#020817 62%,#071b32 100%);background-attachment:fixed;color:var(--ink);min-height:100vh}
button{transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}button:active{transform:scale(.98)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #21a5ff;outline-offset:2px}

.card h2{color:#f3f7ff}.grid{gap:11px}

.stat strong{color:#53b7ff}.stat:nth-child(2) strong{color:#20dfb0}.stat:nth-child(3) strong{color:#ffb22d}.stat:nth-child(4) strong{color:#ff6f91}
.field label{color:#c7d9f0}.field input,.field select{background:#06162b;color:#f0f6ff;border:1px solid #21476f;border-radius:13px;padding:13px}.field input::placeholder{color:#7188a8}.field input:focus,.field select:focus{border-color:#168cff;box-shadow:0 0 0 3px #168cff20;outline:0}
.nav{background:#061329f5;backdrop-filter:blur(18px);border-top:1px solid #1b3d61;box-shadow:0 -8px 24px #0003}.nav button{color:#8099b9;border-radius:12px}.nav button.active{background:linear-gradient(135deg,#103b68,#13294a);color:#ffbd36;box-shadow:inset 0 0 0 1px #267ac0}
.player{border-color:#18314f}.avatar{background:linear-gradient(145deg,#0f6fbd,#142b51);color:white;border:1px solid #2d8ee0}.pill{background:#102e4d;color:#a9d8ff;border:1px solid #22527e}
.present{background:#0a3d39;color:#5cf0c6}.absent{background:#451c31;color:#ff9ab0}.excused{background:#49351a;color:#ffd17a}
.notice{background:#332b1a;border-color:#74531f;color:#ffe1a1}.toast{background:#102b49;border:1px solid #2a6ca4;color:white;box-shadow:0 10px 35px #0008}

.loginlogo{position:relative;overflow:hidden;margin:0 -17px 18px;padding:26px 18px 22px;min-height:265px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;background:radial-gradient(ellipse at 18% 38%,#087eea55,transparent 40%),radial-gradient(ellipse at 90% 15%,#ff7b2450,transparent 36%),linear-gradient(155deg,#07172e,#0b2d4c 57%,#061225);border-bottom:1px solid #24517b;border-radius:0 0 30px 30px}

.loginlogo .ball{display:none}.loginlogo h1,.loginlogo p{position:relative;z-index:1}

<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDivjBuzpt5QmLJdphXkWMllc1khoHa8I8",
  authDomain: "handball-academy-manager-fe8e4.firebaseapp.com",
  projectId: "handball-academy-manager-fe8e4",
  storageBucket: "handball-academy-manager-fe8e4.firebasestorage.app",
  messagingSenderId: "142024172167",
  appId: "1:142024172167:web:ae1e592810f87b09094e22",
  measurementId: "G-VKM3WMPDJ3"
};
let fbApp, auth, store, cloudReady=false, unsubs=[], ownerExists=null, settingUp=false, loginMode='login';
try {
  fbApp=firebase.initializeApp(FIREBASE_CONFIG); auth=firebase.auth(); store=firebase.firestore();
  // حفظ نسخة محلية من Firestore: الحضور يتسجل حتى لو النت فصل في الملعب ويتزامن لما يرجع
  store.enablePersistence({synchronizeTabs:true}).catch(e=>console.warn('Offline persistence unavailable',e&&e.code));
  cloudReady=true;
} catch(e) { console.error('Firebase init failed',e); }
const KEY='ham_v3_cache';
const emptyDB=()=>({teams:[],coaches:[],players:[],attendance:{}});
let db=emptyDB(), session=null, authChecked=!cloudReady, tab='home', chosenTeam='', chosenDate=today(), busy=false;
let repFrom=monthStart(), repTo=today(), repTeam='';
try{localStorage.removeItem('ham_v2_data');localStorage.removeItem('ham_v2_session')}catch(e){}
function cacheDB(){try{if(session)localStorage.setItem(KEY+'_'+session.uid,JSON.stringify(db))}catch(e){}}
function loadCache(uid){try{const d=JSON.parse(localStorage.getItem(KEY+'_'+uid));return d&&d.teams?d:emptyDB()}catch(e){return emptyDB()}}
function today(){return new Date().toLocaleDateString('en-CA')}
function monthStart(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).toLocaleDateString('en-CA')}
function id(){return store?store.collection('_').doc().id:Math.random().toString(36).slice(2,12)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function teamById(tid){return db.teams.find(t=>t.id===tid)}
function visibleTeams(){return session?.role==='manager'?db.teams:db.teams.filter(t=>t.id===session?.teamId)}
function visiblePlayers(tid){return db.players.filter(p=>p.teamId===tid).sort((a,b)=>(Number(a.number)||999)-(Number(b.number)||999)||a.name.localeCompare(b.name,'ar'))}
function myPlayers(){return session?.role==='manager'?db.players:db.players.filter(p=>p.teamId===session?.teamId)}
function attKey(date,pid){return date+'_'+pid}
function parseKey(key){const i=key.indexOf('_');return {date:key.slice(0,i),playerId:key.slice(i+1)}}
let toastTimer;function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2600)}
function cloudErr(e,fallback){console.error(e);const c=e&&e.code||'';if(c.includes('permission-denied'))return toast('مفيش صلاحية للعملية دي');toast(fallback)}

/* ---------- الدخول والجلسة ---------- */
async function login(){
 if(!cloudReady){toast('الاتصال بـ Firebase فشل. تأكد من الإنترنت وافتح التطبيق تاني.');return}
 const email=String(document.getElementById('email').value||'').trim(), password=document.getElementById('password').value;
 if(!email||!password){toast('اكتب البريد الإلكتروني وكلمة المرور');return}
 if(busy)return; busy=true; setLoginBusy(true);
 try { await auth.signInWithEmailAndPassword(email,password); }
 catch(e){console.error(e);toast(firebaseError(e));}
 finally{busy=false;setLoginBusy(false)}
}
function setLoginBusy(on){const b=document.getElementById('loginBtn');if(b){b.disabled=on;b.textContent=on?'لحظة...':(loginMode==='setup'?'إنشاء حساب المدير':'Login · دخول')}}
function firebaseError(e){const c=e&&e.code||'';if(c.includes('wrong-password')||c.includes('invalid-credential')||c.includes('user-not-found')||c.includes('invalid-email'))return 'البريد الإلكتروني أو كلمة المرور غير صحيحة';if(c.includes('network'))return 'مفيش اتصال بالإنترنت';if(c.includes('too-many-requests'))return 'محاولات كثيرة. استنى شوية وجرب تاني';if(c.includes('user-disabled'))return 'الحساب ده موقوف';return 'تعذر تسجيل الدخول: '+(e&&e.message?e.message:c)}
async function onAuth(user){
 if(settingUp)return;
 stopCloudSync();
 if(!user){session=null;db=emptyDB();authChecked=true;render();return}
 try{
   const snap=await store.collection('users').doc(user.uid).get();
   if(!snap.exists){await auth.signOut();toast('الحساب موجود لكن المدير لم يحدد صلاحياته بعد.');return}
   const profile=snap.data();
   if(profile.active!==true||!['manager','coach'].includes(profile.role)){await auth.signOut();toast('الحساب موقوف أو صلاحياته غير صحيحة');return}
   if(profile.role==='coach'&&!profile.teamId){await auth.signOut();toast('الكابتن ده مش مربوط بفريق. كلّم المدير.');return}
   session={uid:user.uid,name:profile.name||user.email,role:profile.role,teamId:profile.teamId||'',email:user.email};
   db=loadCache(user.uid); tab='home'; authChecked=true;
   if(profile.role==='manager'&&ownerExists!==true){store.collection('meta').doc('owner').set({uid:user.uid}).then(()=>ownerExists=true).catch(()=>{})}
   startCloudSync(); render();
 }catch(e){console.error(e);authChecked=true;toast('تعذر قراءة صلاحيات الحساب. تأكد من الإنترنت.');render()}
}
async function logout(){loginMode='login';stopCloudSync();if(auth){try{await auth.signOut()}catch(e){}}session=null;db=emptyDB();render()}

async function checkOwner(){if(!cloudReady)return;try{const d=await store.collection('meta').doc('owner').get();ownerExists=d.exists}catch(e){ownerExists=null}if(!session)render()}
async function setupManager(){
 const name=document.getElementById('setupName').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
 if(!name||!email||password.length<6)return toast('اكتب الاسم والبريد وكلمة مرور 6 أحرف على الأقل');
 if(busy)return;busy=true;settingUp=true;setLoginBusy(true);
 try{const cred=await auth.createUserWithEmailAndPassword(email,password);const uid=cred.user.uid;
  const b=store.batch();b.set(store.collection('users').doc(uid),{role:'manager',active:true,name,email});b.set(store.collection('meta').doc('owner'),{uid});
  try{await b.commit()}catch(e){await cred.user.delete().catch(()=>auth.signOut());throw Object.assign(new Error('owner'),{code:'owner-exists'})}
  ownerExists=true;settingUp=false;loginMode='login';toast('تم إنشاء حساب المدير ✓');await onAuth(cred.user);
 }catch(e){console.error(e);settingUp=false;const c=e&&e.code||'';toast(c==='owner-exists'?'فيه مدير متسجل بالفعل. ادخل بحسابه.':c.includes('email-already-in-use')?'البريد ده متسجل؛ استخدم "دخول"':c.includes('weak-password')?'كلمة المرور ضعيفة':firebaseError(e))}
 finally{busy=false;settingUp=false;setLoginBusy(false)}
}
/* ---------- المزامنة اللحظية (قراءة) ---------- */
function startCloudSync(){
 stopCloudSync(); if(!session||!cloudReady)return;
 const isM=session.role==='manager', uid=session.uid, tid=session.teamId;
 const fail=(col)=>err=>{console.error(col,err);toast('مشكلة في قراءة '+col+'؛ راجع صلاحيات Firestore')};
 const listen=(ref,col,handler)=>unsubs.push(ref.onSnapshot(snap=>{if(!session||session.uid!==uid)return;handler(snap);changed()},fail(col)));
 if(isM) listen(store.collection('teams'),'الفرق',s=>{db.teams=s.docs.map(d=>({id:d.id,...d.data()}))});
 else listen(store.collection('teams').doc(tid),'الفريق',d=>{db.teams=d.exists?[{id:d.id,...d.data()}]:[]});
 listen(isM?store.collection('players'):store.collection('players').where('teamId','==',tid),'اللاعبين',s=>{db.players=s.docs.map(d=>({id:d.id,...d.data()}))});
 listen(isM?store.collection('attendance'):store.collection('attendance').where('teamId','==',tid),'الحضور',s=>{const a={};s.docs.forEach(d=>{const x=d.data();a[attKey(x.date,x.playerId)]={status:x.status,teamId:x.teamId}});db.attendance=a});
 if(isM) listen(store.collection('users').where('role','==','coach'),'الكباتن',s=>{db.coaches=s.docs.filter(d=>d.data().active!==false).map(d=>({id:d.id,name:d.data().name||'',email:d.data().email||'',phone:d.data().phone||'',teamId:d.data().teamId||''}))});
}
let renderTimer;function changed(){cacheDB();clearTimeout(renderTimer);renderTimer=setTimeout(()=>{if(!isTyping())render()},60)}
function isTyping(){const a=document.activeElement;return a&&(a.tagName==='INPUT'&&a.type!=='date'&&a.type!=='file'&&a.value)}
function stopCloudSync(){unsubs.forEach(fn=>{try{fn()}catch(e){}});unsubs=[]}

/* ---------- الكتابة: كل عملية تكتب المستند اللي اتغير بس ---------- */
async function commitInChunks(ops){for(let i=0;i<ops.length;i+=400){const b=store.batch();ops.slice(i,i+400).forEach(fn=>fn(b));await b.commit()}}
function attDoc(date,pid){return store.collection('attendance').doc(attKey(date,pid))}
function setStatus(pid,status){
 const k=attKey(chosenDate,pid), cur=db.attendance[k]?.status;
 if(cur===status){delete db.attendance[k];render();attDoc(chosenDate,pid).delete().catch(e=>cloudErr(e,'لم يتم مسح الحالة من السحابة'));return}
 db.attendance[k]={status,teamId:chosenTeam};render();
 attDoc(chosenDate,pid).set({date:chosenDate,playerId:pid,teamId:chosenTeam,status,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:session.uid}).catch(e=>cloudErr(e,'لم يتم حفظ الحالة؛ راجع الاتصال'));
}
async function markAll(s){
 const ps=visiblePlayers(chosenTeam);if(!ps.length)return;
 ps.forEach(p=>db.attendance[attKey(chosenDate,p.id)]={status:s,teamId:chosenTeam});render();
 try{await commitInChunks(ps.map(p=>b=>b.set(attDoc(chosenDate,p.id),{date:chosenDate,playerId:p.id,teamId:chosenTeam,status:s,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:session.uid})));toast('تم تحديد الكل حاضر')}catch(e){cloudErr(e,'لم يتم حفظ الحالات؛ راجع الاتصال')}
}

function settingsPage(isManager){return `<div class="card"><h2>الحساب</h2><div class="reportrow"><span>الاسم</span><strong>${esc(session.name)}</strong></div><div class="reportrow"><span>البريد</span><strong dir="ltr">${esc(session.email||'')}</strong></div><button class="secondary" style="width:100%;margin-top:10px" onclick="changePassword()">تغيير كلمة المرور</button></div>${isManager?`<div class="card"><h2>النسخ الاحتياطي</h2><p class="muted small">نزّل نسخة من الفرق واللاعبين والحضور، أو استرجع نسخة قديمة (الاسترجاع بيضيف/يحدّث البيانات ومش بيمسح الموجود).</p><button class="primary" style="width:100%" onclick="backup()">تنزيل نسخة احتياطية</button><div class="field"><label>استرجاع نسخة JSON</label><input type="file" id="restoreFile" accept=".json,application/json"></div><button class="secondary" style="width:100%" onclick="restore()">استرجاع البيانات</button></div>`:''}<div class="notice">البيانات بتتزامن عبر Firebase. لو النت فصل أثناء تسجيل الحضور، التسجيل بيتحفظ على الموبايل ويترفع أول ما النت يرجع.</div><p class="foot">Handball Academy Manager · إصدار 2.0 · ويب</p>`}

function restore(){let f=document.getElementById('restoreFile').files[0];if(!f)return toast('اختار ملف النسخة الاحتياطية');let r=new FileReader();r.onload=async()=>{let x;try{x=JSON.parse(r.result);if(!Array.isArray(x.teams)||!Array.isArray(x.players)||typeof x.attendance!=='object')throw 0}catch(e){return toast('الملف غير صالح')}
 if(!confirm(`استرجاع ${x.teams.length} فريق و${x.players.length} لاعب و${Object.keys(x.attendance).length} سجل حضور؟`))return;
 const ops=[];x.teams.forEach(t=>{if(!t.id)return;ops.push(b=>b.set(store.collection('teams').doc(t.id),{name:String(t.name||'')},{merge:true}))});
 x.players.forEach(p=>{if(!p.id)return;ops.push(b=>b.set(store.collection('players').doc(p.id),{name:String(p.name||''),teamId:String(p.teamId||''),number:String(p.number||'')},{merge:true}))});
 Object.entries(x.attendance).forEach(([k,v])=>{const {date,playerId}=parseKey(k);if(!date||!playerId||!v||!v.status)return;const p=x.players.find(q=>q.id===playerId);ops.push(b=>b.set(store.collection('attendance').doc(k),{date,playerId,teamId:v.teamId||p?.teamId||'',status:v.status,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:session.uid},{merge:true}))});
 toast('جاري الاسترجاع...');try{await commitInChunks(ops);toast('تم استرجاع النسخة')}catch(e){cloudErr(e,'الاسترجاع ماكملش؛ جرّب تاني')}};r.readAsText(f)}
function exportCSV(){const isM=session.role==='manager';const {records}=reportData(isM);let lines=[['اللاعب','رقم القميص','الفريق','التاريخ','الحالة']];records.sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{const p=db.players.find(x=>x.id===r.playerId);lines.push([p.name,p.number||'',teamById(p.teamId)?.name||'',r.date,r.status==='present'?'حاضر':r.status==='absent'?'غائب':'معتذر'])});if(lines.length===1)return toast('مفيش بيانات في الفترة دي');let csv='﻿'+lines.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),`attendance-${repFrom}_${repTo}.csv`)}
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
async function download(blob,name){if(isIOS()&&navigator.canShare){try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

render();
if(cloudReady){checkOwner();auth.onAuthStateChanged(onAuth)}
</script>
